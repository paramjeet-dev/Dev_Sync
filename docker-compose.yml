services:
  mongodb:
    image: mongo:7
    container_name: dev-sync-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - dev-sync-net

  backend:
    build:
      context: ./backend
    container_name: dev-sync-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:5173
      MONGODB_URI: mongodb://mongodb:27017/dev-sync
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret}
      JWT_EXPIRES_IN: 7d
      COOKIE_NAME: dev_sync_token
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAX_AUDIO_SIZE_MB: 25
    networks:
      - dev-sync-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    container_name: dev-sync-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - dev-sync-net

networks:
  dev-sync-net:
    driver: bridge

volumes:
  mongo-data:
